[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "namma-drishti"
version = "1.0.0"
description = "Offline edge object detection and counting for safer streets, using ExecuTorch on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Namma Drishti team" }]
keywords = ["executorch", "edge-ai", "raspberry-pi", "object-detection", "yolo11", "road-safety"]
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
namma-drishti = "namma_drishti.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/namma_drishti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
