[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arten"
version = "1.0.0"
description = "Arten — Edge Object Detection, Counting & Attributes. Offline edge AI for safer streets using ExecuTorch on Raspberry Pi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Arten team" }]
keywords = ["executorch", "edge-ai", "raspberry-pi", "object-detection", "counting", "attributes", "road-safety"]
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arten = "arten.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arten"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
