<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-label="Arten pipeline: input, preprocessing, ExecuTorch inference, decoding, counting, evidence, all on a Raspberry Pi">
  <defs>
    <style>
      .bg { fill: #0c1016; }
      .box { fill: #151d27; stroke: #2b3a4a; stroke-width: 1.5; rx: 14; }
      .box-accent { fill: #12251c; stroke: #3cdc3c; stroke-width: 2; rx: 14; }
      .title { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .body { fill: #b8c7d4; font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
      .micro { fill: #7f93a3; font-family: Arial, Helvetica, sans-serif; font-size: 13px; }
      .mono { fill: #ffdc78; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
      .arrow { stroke: #5d7a91; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .band { fill: #101a23; stroke: #223140; stroke-width: 1; rx: 10; }
      .dot { fill: #3cdc3c; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5d7a91"/>
    </marker>
  </defs>

  <rect class="bg" width="1240" height="560"/>

  <!-- Title -->
  <text x="48" y="58" class="title" font-size="30">Arten — one local pipeline, six stages</text>
  <text x="48" y="86" class="body" font-size="16">A 15-second clip or a folder of images goes in. Counts, annotated evidence and latency numbers come out. Nothing leaves the device.</text>

  <!-- Row 1 -->
  <rect class="box" x="48" y="130" width="210" height="130"/>
  <text x="68" y="166" class="title" font-size="17">1 · Input</text>
  <text x="68" y="194" class="body">Organiser clip / images</text>
  <text x="68" y="218" class="micro">MP4, AVI, JPG, PNG</text>
  <text x="68" y="240" class="micro">any resolution, EXIF-aware</text>

  <rect class="box" x="306" y="130" width="250" height="130"/>
  <text x="326" y="166" class="title" font-size="17">2 · Preprocess</text>
  <text x="326" y="194" class="body">Letterbox to 640×640</text>
  <text x="326" y="218" class="micro">RGB, /255, pad 114</text>
  <text x="326" y="240" class="micro">inverse transform kept</text>

  <rect class="box-accent" x="604" y="130" width="290" height="130"/>
  <text x="624" y="166" class="title" font-size="17">3 · ExecuTorch inference</text>
  <text x="624" y="194" class="body">YOLO11n · INT8 · XNNPACK</text>
  <text x="624" y="218" class="micro">4.73 MB .pte · CPU only</text>
  <text x="624" y="240" class="mono">7.46 FPS on Pi 5 (reference)</text>

  <rect class="box" x="942" y="130" width="250" height="130"/>
  <text x="962" y="166" class="title" font-size="17">4 · Decode</text>
  <text x="962" y="194" class="body">4 xywh + 80 classes</text>
  <text x="962" y="218" class="micro">confidence filter</text>
  <text x="962" y="240" class="micro">per-class NMS → xyxy</text>

  <!-- Arrows row 1 -->
  <path class="arrow" d="M258 195 L296 195"/>
  <path class="arrow" d="M556 195 L594 195"/>
  <path class="arrow" d="M894 195 L932 195"/>

  <!-- Row 2 -->
  <rect class="box" x="604" y="330" width="290" height="130"/>
  <text x="624" y="366" class="title" font-size="17">5 · Count</text>
  <text x="624" y="394" class="body">Per-category counts / frame</text>
  <text x="624" y="418" class="micro">peak · mean · p95</text>
  <text x="624" y="440" class="micro">optional IoU tracker → unique*</text>

  <rect class="box" x="942" y="330" width="250" height="130"/>
  <text x="962" y="366" class="title" font-size="17">6 · Evidence</text>
  <text x="962" y="394" class="body">CSV · JSONL · summary</text>
  <text x="962" y="418" class="micro">annotated frames / video</text>
  <text x="962" y="440" class="micro">latency percentiles</text>

  <path class="arrow" d="M749 262 L749 320"/>
  <path class="arrow" d="M894 395 L932 395"/>

  <!-- Side note -->
  <rect class="band" x="48" y="330" width="508" height="130"/>
  <text x="70" y="366" class="title" font-size="16">Why this shape?</text>
  <text x="70" y="394" class="body" font-size="14">• Mandatory output first: per-frame counts.</text>
  <text x="70" y="416" class="body" font-size="14">• Unique counts are clearly labelled indicative.</text>
  <text x="70" y="438" class="body" font-size="14">• Every stage is timed, so the report is reproducible.</text>

  <!-- Bottom band -->
  <rect class="band" x="48" y="492" width="1144" height="44"/>
  <circle class="dot" cx="70" cy="514" r="5"/>
  <text x="86" y="519" class="body" font-size="14">Raspberry Pi 5 · 64-bit Raspberry Pi OS · Python 3.13 · ExecuTorch 1.1.0 · XNNPACK</text>
  <text x="1030" y="519" class="micro" font-size="13">no cloud · no identities</text>
</svg>
